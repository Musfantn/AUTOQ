# =============================================================================
# VNPT HIS Bridge — Config mẫu
# =============================================================================
# Tất cả tham số nghiệp vụ phải điền vào đây.
# KHÔNG hardcode trong mã nguồn.
# Có thể override bằng biến môi trường (xem ghi chú).
# =============================================================================

his:
  # URL VNPT HIS RestService
  # Override: HIS_BASE_URL env var
  base_url: "https://bvhatinh.vncare.vn/vnpthis/RestService"

  # Mã bệnh viện (ví dụ: 42 = BV ĐK Thị xã Kỳ Anh)
  hospital_id: "42"

  # Mã khoa (ví dụ: 26060 = Khoa CĐHA)
  department_id: "26060"

  # Mã phòng (ví dụ: 77846)
  room_id: "77846"

  # Tên database HIS (ví dụ: HIS_DATA_HTH_KYANH)
  database_name: "HIS_DATA_HTH_KYANH"

  # Mã bổ sung [4] (ví dụ: 26257)
  extra_id: "26257"

  # Tên các stored procedure — thay đổi khi HIS cập nhật
  stored_procedures:
    search: "CLS02C001.SIDS"            # Tìm kiếm bệnh nhân
    patient_info: "NGT02K016.EV003"      # Lấy thông tin chi tiết
    services: "CLS02C001.DSKQ"           # Lấy danh sách dịch vụ

  # HTTP Headers gửi cùng request (giống trình duyệt)
  headers:
    User-Agent: "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
    Content-Type: "application/json; charset=UTF-8"
    X-Requested-With: "XMLHttpRequest"
    Accept: "application/json, text/javascript, */*; q=0.01"

  # Session xác thực — lấy từ trình duyệt đã đăng nhập HIS
  # Hướng dẫn: Mở Chrome → F12 → Application → Cookies → bvhatinh.vncare.vn
  # Override: HIS_JSESSIONID, HIS_UUID_JWT env vars
  session:
    jsessionid: "1B19E07E24164E5C3F7ACC0386359463.APP48"
    sessionid: "!OkiTf68dQXLw9el1nXdznSBmexNu7z0XNb8srP4U3fo3EiAWFhDLthFd4+UqT+L9jVz2+WmHSDp91g=="
    uuid_jwt: "eyJhbGciOiJIUzUxMiJ9..Jij1-6GuuqKaoSZGvzlCfekvWjyal0UqiACUT2pyi-ChMghtnlmpVGXNgqyZXnYe9BWgAG8Fa69ajjNYIr-2zA"

network:
  timeout_seconds: 10
  max_retries: 3
  retry_delay_seconds: 1
  connection_pool_size: 5

cache:
  # Nếu quét cùng barcode trong khoảng thời gian này (giây),
  # sẽ trả về kết quả cache — không gọi HIS lần nữa
  ttl_seconds: 5

firestore:
  # Override: FIREBASE_API_KEY env var
  api_key: "AIzaSyCzwZJ_STEXN3bhEUXEDhaeLcjkx5kVvxQ"
  # Override: FIREBASE_PROJECT env var
  project: "tasksched"
  collection: "autoq_queues"

logging:
  level: "INFO"                          # INFO, WARNING, ERROR
  file: "logs/his_bridge.log"
  max_bytes: 5242880                     # 5 MB
  backup_count: 3
